spring:
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      secret-key: test-secret-key-12345678901234567890123456789012
      expiration: 86400000
      refresh-token:
        expiration: 604800000

  scheduler:
    generate-occurrences: 0 0 0 * * *

logging:
  level:
    org.hibernate.SQL: DEBUG